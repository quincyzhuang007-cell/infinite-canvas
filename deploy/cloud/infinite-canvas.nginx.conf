server {
    listen 80;
    server_name canvas.qinyuanhangzhou.top;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; auth_basic off; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name canvas.qinyuanhangzhou.top;
    ssl_certificate /etc/letsencrypt/live/canvas.qinyuanhangzhou.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/canvas.qinyuanhangzhou.top/privkey.pem;
    client_max_body_size 500m;

    # Only the explicit login request uses Basic Auth; all other app/API requests use the session cookie.
    location = /collaboration/session/login {
        auth_basic "Canvas team";
        auth_basic_user_file /etc/nginx/canvas-team.htpasswd;
        error_page 401 =200 @canvas_team_login_failed;
        proxy_pass http://127.0.0.1:17372;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Canvas-Team-User $remote_user;
    }

    location @canvas_team_login_failed {
        default_type application/json;
        return 200 '{"authenticated":false,"error":"用户名或密码错误"}';
    }

    location ^~ /collaboration/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:17372;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Canvas-Team-User "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        auth_basic off;
        root /opt/infinite-canvas/releases/team-session-20260928-01/web/dist;
        try_files $uri $uri/ /index.html;
    }
}
